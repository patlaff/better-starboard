services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - apps_net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: starboard
      POSTGRES_PASSWORD: starboard
      POSTGRES_DB: starboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  apps_net:
    external: true   # pre-existing macvlan network — "docker network create" separately
  internal:
    driver: bridge
    internal: true   # no external routing; db is unreachable from outside

volumes:
  pgdata:
